<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Céphalée - Post-Hardcore Lille</title>

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/img/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/img/android-chrome-512x512.png">
    <link rel="manifest" href="/site.webmanifest">

    <!-- Meta tags SEO -->
    <meta name="description" content="Céphalée, groupe de post-hardcore de Lille. Fusion unique de post-hardcore, rock progressif et grunge.">
    <meta name="keywords" content="Céphalée, post-hardcore Lille, post-hardcore, groupe Lille, concert">
    <meta name="author" content="Céphalée">
    <link rel="canonical" href="https://cephalee-band.fr" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cephalee-band.fr">
    <meta property="og:title" content="Céphalée - Post-Hardcore de Lille">
    <meta property="og:description" content="Ranting and raving about nonsense. Groupe de post-hardcore de Lille.">
    <meta property="og:image" content="https://cephalee-band.fr/img/band.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <main class="landing">
        <section class="hero" aria-label="Céphalée">
            <img
                class="hero-photo"
                src="./img/band.jpg"
                alt="Céphalée, groupe de post-hardcore de Lille"
                width="1600"
                height="1067"
            >

            <div class="hero-veil" aria-hidden="true"></div>

            <div class="hero-content">
                <img
                    class="logo"
                    src="./img/logo.png"
                    alt="Céphalée"
                    width="800"
                    height="200"
                >
                <p class="baseline">Ranting and raving about nonsense</p>

                <nav class="socials" aria-label="Réseaux sociaux">
                    <a href="https://instagram.com/cephalee.band" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                        <i class="fab fa-instagram" aria-hidden="true"></i>
                    </a>
                    <a href="https://facebook.com/cephalee.band" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
                        <i class="fab fa-facebook-f" aria-hidden="true"></i>
                    </a>
                    <a href="https://www.youtube.com/@cephalee" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
                        <i class="fab fa-youtube" aria-hidden="true"></i>
                    </a>
                    <a href="/redirect.html?to=spotify" aria-label="Spotify">
                        <i class="fab fa-spotify" aria-hidden="true"></i>
                    </a>
                    <a href="/redirect.html?to=apple" aria-label="Apple Music">
                        <i class="fab fa-apple" aria-hidden="true"></i>
                    </a>
                    <a href="/redirect.html?to=deezer" aria-label="Deezer">
                        <i class="fab fa-deezer" aria-hidden="true"></i>
                    </a>
                </nav>
            </div>
        </section>
    </main>
</body>
</html>
